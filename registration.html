<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Регистрация на Ферме</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="profile.css"> 
</head>
<body>
    <main class="container profile-page">
        <section class="profile-card yellow-border">
            <h2>Добро Пожаловать на Ферму! 🌾</h2>
            <p>Создайте свой профиль, чтобы начать инвестировать.</p>
            <form id="registration-form" class="reg-form">
                <div class="form-group">
                    <label for="reg-username">Имя Пользователя:</label>
                    <input type="text" id="reg-username" required>
                    <small id="username-error" style="color: red;"></small>
                </div>
                <div class="form-group">
                    <label for="reg-password">Пароль:</label>
                    <input type="password" id="reg-password" required>
                </div>
                <div class="form-group">
                    <label for="reg-dob">Дата Рождения:</label>
                    <input type="date" id="reg-dob" required>
                </div>
                
                <button type="submit" class="action-btn green-btn"><i class="fas fa-seedling"></i> Зарегистрироваться</button>
            </form>
            <p class="login-link">Уже есть аккаунт? <a href="index.html">Войти</a></p>
        </section>
    </main>
    <script src="registration.js"></script>
</body>
</html>
