<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛠️ Админ-Панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">🛠️ Администрирование</a>
            <div class="d-flex">
                <a href="index.html" class="btn btn-warning"><i class="fas fa-home me-2"></i>Главная</a>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card shadow h-100 border-success">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-plus me-2"></i>Добавить Новое Животное</h5>
                    </div>
                    <div class="card-body">
                        <form id="add-animal-form">
                            <div class="mb-3">
                                <label for="animal-name" class="form-label">Название Животного:</label>
                                <input type="text" id="animal-name" class="form-control" required>
                            </div>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label for="animal-price" class="form-label">Цена (Р):</label>
                                    <input type="number" id="animal-price" class="form-control" step="0.01" min="1" required>
                                </div>
                                <div class="col-6">
                                    <label for="animal-income" class="form-label">Доход в день (Р):</label>
                                    <input type="number" id="animal-income" class="form-control" step="0.01" min="0.01" required>
                                </div>
                            </div>
                            <p class="mt-3">Расчетный Срок Работы: <strong id="calculated-duration" class="text-info">N/A</strong> дней</p>
                            <button type="submit" class="btn btn-warning w-100"><i class="fas fa-plus me-2"></i>Добавить в Список</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card shadow h-100 border-warning">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0"><i class="fas fa-cogs me-2"></i>Управление Пользователями</h5>
                    </div>
                    <div class="card-body">
                        <h6 class="text-success">1. Пополнить Баланс</h6>
                        <form id="admin-replenish-form" class="mb-4">
                            <div class="input-group mb-2">
                                <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                                <input type="number" id="replenish-user-id" class="form-control" placeholder="ID Пользователя" required>
                            </div>
                            <div class="input-group mb-2">
                                <span class="input-group-text">Р</span>
                                <input type="number" id="replenish-amount" class="form-control" step="0.01" min="1" placeholder="Сумма" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100"><i class="fas fa-money-bill-wave me-2"></i>Зачислить</button>
                        </form>

                        <h6 class="text-success mt-3">2. Выдать Животное</h6>
                        <form id="admin-give-animal-form">
                            <div class="input-group mb-2">
                                <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                                <input type="number" id="give-animal-user-id" class="form-control" placeholder="ID Пользователя" required>
                            </div>
                            <select id="animal-select" class="form-select mb-3" required></select>
                            <button type="submit" class="btn btn-warning w-100"><i class="fas fa-gift me-2"></i>Выдать Животное</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-12">
                <div class="card shadow border-info">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-users me-2"></i>Список Всех Пользователей (<span id="user-count">0</span>)</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                             <table class="table table-striped table-hover mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Имя</th>
                                        <th>Баланс (Покупки)</th>
                                        <th>Дата Рег.</th>
                                    </tr>
                                </thead>
                                <tbody id="registered-users-list">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="card shadow border-success">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-list me-2"></i>Текущие Животные (Общий Список)</h5>
                    </div>
                    <ul id="current-animals-list" class="list-group list-group-flush">
                        </ul>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
