<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👤 Профиль Пользователя</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <header class="header">
        <h1>👤 Личный Кабинет</h1>
        <nav class="main-nav">
            <a href="index.html" class="nav-button farm-btn"><i class="fas fa-home"></i> Главная</a>
            <a href="farm.html" class="nav-button farm-btn"><i class="fas fa-tractor"></i> Ферма</a>
        </nav>
    </header>

    <main class="container profile-page">
        <section class="profile-card yellow-border">
            <h2>Ваши Личные Данные</h2>
            <div id="user-data">
                <p class="immutable-data"><strong>Ваш Telegram ID:</strong> <span id="user-id-display">N/A</span></p> 
                <p><strong>Имя Пользователя:</strong> <span id="username-display">N/A</span></p>
                <p><strong>Email:</strong> <span id="email-display">N/A</span></p>
                <p class="immutable-data"><strong>Дата Регистрации:</strong> <span id="reg-date-display">N/A</span></p>
                <p><strong>Пароль (Ваше Имя):</strong> <span id="password-display">N/A</span></p>
                <p><strong>Дата Рождения:</strong> <span id="dob-display">N/A</span></p>
            </div>
            
            <div class="profile-actions">
                <button id="edit-profile-btn" class="action-btn green-btn"><i class="fas fa-edit"></i> Изменить Профиль</button>
                <button id="delete-profile-btn" class="action-btn reinvest-btn"><i class="fas fa-trash"></i> Удалить Профиль</button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2025 Ферма Инвестиций. Ваш личный уголок.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="./profile.js"></script>
</body>
</html>
